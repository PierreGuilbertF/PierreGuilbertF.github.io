<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pierre Guilbert</title>
    <meta name="author" content="Pierre Guilbert">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #faf9f6;
        color: #202b35;
        border-top: 4px solid #235d69;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: clamp(64px, 12vw, 140px) 28px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 4rem);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.025em;
      }
      .profile-photo { float: right; width: clamp(96px, 20vw, 160px); height: auto; margin: 0 0 24px 24px; border-radius: 6px; }
      @media (max-width: 500px) { .profile-photo { float: none; display: block; margin: 0 0 28px; } }
      .headline { color: #235d69; font-size: 1.2rem; line-height: 1.6; margin: 22px 0; }
      nav { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 32px; font: 1rem/1.6 system-ui, sans-serif; }
      a { color: #235d69; text-underline-offset: .2em; }
      a:focus-visible { outline: 2px solid #235d69; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img class="profile-photo" src="profile_picture.png" alt="Portrait of Pierre Guilbert" width="836" height="852">
      <h1>Pierre Guilbert</h1>
      <p class="headline">Computer Vision, Machine Learning &amp; Mathematical Modelling</p>
      <nav aria-label="Main navigation">
        <a href="cv.html">Curriculum Vitae</a>
        <a href="output/pdf/cv.pdf">Download CV (PDF)</a>
      </nav>
    </main>
  </body>
</html>
