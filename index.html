<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pierre Guilbert</title>
    <meta name="author" content="Pierre Guilbert">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #faf9f6;
        color: #202b35;
        border-top: 4px solid #235d69;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: clamp(64px, 12vw, 140px) 28px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 4rem);
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: -0.025em;
      }
    </style>
  </head>

    <main>
      <h1>Pierre Guilbert</h1>
    </main>
  </body>
